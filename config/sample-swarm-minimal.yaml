REPO_OWNER: your-github-org-or-user
REPO_NAME: your-repository
REPO_PATH: /absolute/path/to/your/local/repository
LOG_PATH: /absolute/path/to/your/local/repository
MANDATORY_TESTS:
  - make test
  - make test-coverage
HARD_GATE_MODE: PARALLEL
REVIEW_GATE_ALERT_MINUTES: 15
# Minimal explicit policy: built-in role profiles, lanes, bounds, budgets, and actions
# are resolved and snapshotted by the strict policy parser.
REVIEW_POLICY:
  VERSION: 1
MAX_STORED_HANDOFFS: 100
MAX_HANDOFFS_IN_CONTEXT: 5
